name: VoxSplice CI & Multi-Voice Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux DSP, Arena & Multi-Voice E2E Suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install native audio & speech libraries (PocketSphinx + Flite + PulseAudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpocketsphinx3 libsphinxbase3 pocketsphinx-en-us \
            flite libflite1 ffmpeg pulseaudio-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Unit & Real Multi-Voice End-to-End Verification Suite
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify CLI & Model Hub Catalog
        run: |
          voxsplice doctor
          voxsplice models list

  test-windows:
    name: Windows Core DSP, Phonetics & Viterbi Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Core Unit Suite on Windows
        run: |
          $env:PYTHONPATH="src"
          python -m unittest tests/test_unit_dsp_and_arena.py -v
