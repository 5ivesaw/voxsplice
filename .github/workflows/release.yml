name: Build & Publish Tauri v2 + Standalone Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v2.4.0)"
        required: false
        default: "v2.4.0"

permissions:
  contents: write

jobs:
  build-tauri-and-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_label: linux-x86_64
          - platform: windows-latest
            os_label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies (WebKit2GTK + PocketSphinx + Flite)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libpocketsphinx3 libsphinxbase3 pocketsphinx-en-us flite libflite1

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Python dependencies & verify Starter Pack / Studio UI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/build_studio_html.py

      - name: Build Tauri v2 Native Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name || inputs.release_tag || 'v2.4.0' }}
          releaseName: "VoxSplice v${{ github.ref_name || inputs.release_tag || '2.4.0' }}"
          releaseBody: "Automated multi-platform release of VoxSplice Studio (Lightweight Tauri v2 Desktop App + CLI/TUI + 5-Tier Viterbi Stitcher)."
          releaseDraft: false
          prerelease: false

      - name: Package Standalone Portable Archive (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist-bundle/voxsplice-linux-x86_64
          cp -r src ui assets bridges scripts tests pyproject.toml requirements.txt config.default.toml install.sh README.md LICENSE dist-bundle/voxsplice-linux-x86_64/
          tar -czf voxsplice-linux-x86_64.tar.gz -C dist-bundle voxsplice-linux-x86_64

      - name: Package Standalone Portable Archive (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-bundle/voxsplice-windows-x86_64
          Copy-Item -Recurse src, ui, assets, bridges, scripts, tests, pyproject.toml, requirements.txt, config.default.toml, install.ps1, README.md, LICENSE dist-bundle/voxsplice-windows-x86_64/
          Compress-Archive -Path dist-bundle/voxsplice-windows-x86_64 -DestinationPath voxsplice-windows-x86_64.zip -Force

      - name: Upload Portable Archives to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            voxsplice-linux-x86_64.tar.gz
            voxsplice-windows-x86_64.zip
