[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxsplice"
version = "2.4.0"
description = "Lightweight real-time concatenative voice reconstruction & coarticulation-aware audio splicer for Linux (PipeWire/PulseAudio) and Windows (WASAPI/VB-Cable)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "VoxSplice Engineering" }
]
keywords = ["audio", "voice-cloning", "concatenative-synthesis", "dsp", "pipewire", "tauri", "viterbi", "pocketsphinx", "vosk"]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
stt = [
  "vosk>=0.3.45",
  "faster-whisper>=1.0.0",
  "onnxruntime>=1.16.0",
]
embeddings = [
  "model2vec>=0.3.0",
]
windows = [
  "sounddevice>=0.4.6",
]

[project.scripts]
voxsplice = "voxsplice.cli:main"
5mic = "voxsplice.cli:main"
mimic = "voxsplice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
