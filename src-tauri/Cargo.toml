[package]
name = "voxsplice-desktop"
version = "2.4.0"
description = "VoxSplice — Lightweight Real-Time Concatenative Voice Reconstruction & Audio Splicing Desktop App"
authors = ["VoxSplice Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "voxsplice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
